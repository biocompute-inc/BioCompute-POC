# ---------------------------------------------------------------------------
# Rate-limiting zones
# ---------------------------------------------------------------------------
# Keyed on binary client IP to minimise memory.
# "auth_strict" zone — tighten burst on authentication endpoints
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
# "api_general" zone — general back-end API limit
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

server {
  listen 80;

  client_max_body_size 500M;

  # -------------------------------------------------------------------------
  # Security headers (applied to all locations in this server block)
  # The backend also sets these via SecurityHeadersMiddleware; setting them
  # here as well ensures they appear even on nginx-generated error responses.
  # -------------------------------------------------------------------------
  add_header X-Frame-Options            "DENY"                              always;
  add_header X-Content-Type-Options     "nosniff"                           always;
  add_header X-XSS-Protection           "1; mode=block"                     always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
  add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
  # HSTS — uncomment once you have a valid cert / Cloudflare enforces HTTPS:
  # add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # -------------------------------------------------------------------------
  # Auth endpoints — stricter rate limit (login, register, forgot-password)
  # Matched with a case-sensitive regex so it takes precedence over /api/.
  # -------------------------------------------------------------------------
  location ~ ^/api/auth/(login|register|forgot-password)$ {
    limit_req zone=auth_strict burst=5 nodelay;
    limit_req_status 429;

    # Strip the /api prefix via rewrite, then proxy without trailing slash
    rewrite ^/api(.+)$ $1 break;
    proxy_pass http://backend:8000;

    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
  }

  # -------------------------------------------------------------------------
  # Backend API — general rate limit
  # -------------------------------------------------------------------------
  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req_status 429;

    # Trailing slash strips the /api/ prefix
    proxy_pass http://backend:8000/;

    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    # Tell FastAPI that Cloudflare is handling HTTPS
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }
}
