server {
  listen 80;
  
  client_max_body_size 500M;  # Set to whatever max file size you need

  # Frontend
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Backend API
  location /api/ {
    # 1. THE FIX: Change "localhost" to your Docker service name "backend"
    # KEEP the trailing slash so it strips "/api/"
    proxy_pass http://backend:8000/;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # 2. THE SSL FIX: Tell FastAPI that Cloudflare is handling HTTPS
    proxy_set_header X-Forwarded-Proto https;
    
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }
}