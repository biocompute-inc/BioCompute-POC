version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: poc_nginx
    # REMOVED: "80:80" ports. 
    # The tunnel talks to Nginx internally. You no longer need to open port 80 to the world.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/DockerFile
    container_name: poc_backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./tools:/app/tools
      - ./artifacts:/app/artifacts
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/poc-frontend
      dockerfile: DockerFile
    container_name: poc_frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/poc-frontend/.env.local
    volumes:
      - ./frontend/poc-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  # NEW: Cloudflare Tunnel Service
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - app_network

networks:
  app_network:
    driver: bridge