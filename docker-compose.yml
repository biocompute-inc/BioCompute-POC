version: '3.8'

services:
  backend:
    build:
      context: .                  # Build from the root directory so it can access tools/
      dockerfile: backend/DockerFile
    container_name: poc_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env            # Inject your Supabase DB URL and backend vars here
    volumes:
      # These 3 lines create the "tunnel" between your WSL files and the container
      - ./backend:/app/backend
      - ./tools:/app/tools
      - ./artifacts:/app/artifacts
    # The --reload flag tells Uvicorn to watch the mounted /app/backend folder for changes
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend/poc-frontend
      dockerfile: DockerFile
    container_name: poc_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/poc-frontend/.env.local  # Inject your Next.js vars here
    volumes:
      - ./frontend/poc-frontend:/app
      - /app/node_modules         # Prevent local node_modules from conflicting
    depends_on:
      - backend