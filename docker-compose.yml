version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: poc_nginx
    ports:
      - "80:80"          # Only nginx is exposed now
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/DockerFile
    container_name: poc_backend
    # No ports exposed externally — nginx talks to it internally
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./tools:/app/tools
      - ./artifacts:/app/artifacts
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend/poc-frontend
      dockerfile: DockerFile
    container_name: poc_frontend
    # No ports exposed externally — nginx talks to it internally
    expose:
      - "3000"
    env_file:
      - ./frontend/poc-frontend/.env.local
    volumes:
      - ./frontend/poc-frontend:/app
      - /app/node_modules
    depends_on:
      - backend