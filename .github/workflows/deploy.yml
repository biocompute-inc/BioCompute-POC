name: Pi Deploy

on:
  push:
    branches: [ Main ] # Or whatever your team's main branch is

jobs:
  deploy:
    runs-on: self-hosted  # <--- This tells GitHub to talk to your Pi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Env
        run: cp /home/biocompute/biocompute-poc/BioCompute-POC/.env . # Adjust path if needed

      - name: Build and Run
        run: docker compose up -d --build